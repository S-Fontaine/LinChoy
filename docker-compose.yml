services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: https://api.linchoy.com
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.5
    env_file:
      - ./frontend/.env

  docker-proxy:
    image: tecnativa/docker-socket-proxy
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy-net

  docker-power-proxy:
    build: ./docker-power-proxy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - docker-proxy-net

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    env_file:
      - ./backend/.env
    environment:
      DOCKER_PROXY_HOST: docker-proxy
      DOCKER_PROXY_PORT: 2375
      DOCKER_POWER_PROXY_HOST: docker-power-proxy
      DOCKER_POWER_PROXY_PORT: 3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - docker-proxy
      - docker-power-proxy
    networks:
      - default
      - docker-proxy-net
    volumes:
      - ${MINECRAFT_DATA_DIR}:/whitelist/minecraft-multicorp
      - ${VALHEIM_DATA_DIR}:/whitelist/valheim-server

networks:
  docker-proxy-net:
    internal: true
