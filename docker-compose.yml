services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: https://api.linchoy.com
    restart: unless-stopped
    env_file:
      - ./frontend/.env

  docker-proxy:
    image: tecnativa/docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy-net

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DOCKER_PROXY_HOST: docker-proxy
      DOCKER_PROXY_PORT: 2375
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - docker-proxy
    networks:
      - default
      - docker-proxy-net

networks:
  docker-proxy-net:
    internal: true