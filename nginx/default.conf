map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

http {
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;

    server {
        listen 80;
        server_name linchoy.com www.linchoy.com api.linchoy.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.linchoy.com;

        ssl_certificate /etc/letsencrypt/live/linchoy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/linchoy.com/privkey.pem;

        return 301 https://linchoy.com$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name linchoy.com;

        ssl_certificate /etc/letsencrypt/live/linchoy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/linchoy.com/privkey.pem;

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.linchoy.com;

        ssl_certificate /etc/letsencrypt/live/api.linchoy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.linchoy.com/privkey.pem;

        location / {
            proxy_pass http://backend:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}