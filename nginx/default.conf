map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name linchoy.com www.linchoy.com api.linchoy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.linchoy.com;

    ssl_certificate /etc/letsencrypt/live/linchoy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linchoy.com/privkey.pem;

    return 301 https://linchoy.com$request_uri;
}

server {
    listen 443 ssl;
    server_name linchoy.com;

    ssl_certificate /etc/letsencrypt/live/linchoy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linchoy.com/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.linchoy.com;

    ssl_certificate /etc/letsencrypt/live/api.linchoy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.linchoy.com/privkey.pem;

    location / {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
